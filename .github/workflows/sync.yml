name: Running Sync

on:
  workflow_dispatch:
    inputs:
      activity_id:
        description: "Strava activity ID"
        required: false
        type: string
      garmin_activity_id:
        description: "Retroactive: Garmin activity ID to reprocess (empty = normal flow)"
        required: false
        type: string
      garmin_workout_id:
        description: "Retroactive: Garmin workout ID to link to that activity (needs garmin_activity_id)"
        required: false
        type: string
      lap_distance_m:
        description: "Retroactive: true distance of each button lap in metres, e.g. 2000 (needs lap_range)"
        required: false
        type: string
      lap_range:
        description: "Retroactive: laps that get lap_distance_m, e.g. 1-7"
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GARMIN_ACTIVITY_ID: ${{ github.event.inputs.garmin_activity_id }}
      GARMIN_WORKOUT_ID: ${{ github.event.inputs.garmin_workout_id }}
      GARMIN_LAP_DISTANCE_M: ${{ github.event.inputs.lap_distance_m }}
      GARMIN_LAP_RANGE: ${{ github.event.inputs.lap_range }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Print trigger info
        run: |
          echo "Activity ID:"
          echo "${{ github.event.inputs.activity_id }}"

      - name: Download Garmin data
        id: download
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python scripts/download_fit.py

      - name: Parse data
        if: steps.download.outputs.skip != 'true'
        run: |
          python scripts/parse_fit.py

      - name: Upload report to Google Drive
        if: steps.download.outputs.skip != 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python scripts/upload_drive.py

      - name: Upload artifacts
        if: steps.download.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: running-data
          path: |
            activity.fit
            activity.json
            workout.json
            running-data.json